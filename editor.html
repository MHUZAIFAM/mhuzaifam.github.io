<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/images/favicon.png" type="image/png">
<title>Content Editor</title>
<style>
  :root{
    --bg:#141416; --panel:#1b1b1e; --panel2:#212125; --line:#2e2e34;
    --txt:#e8e8ea; --dim:#9a9aa4; --accent:#6c63ff; --accent2:#8b84ff;
    --ok:#3ecf8e; --warn:#f5a524; --danger:#f2545b; --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 "Poppins",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       overflow:hidden}
  button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:8px 14px;
         background:var(--panel2);color:var(--txt);transition:.15s}
  button:hover{background:#2c2c33}
  button.primary{background:var(--accent);color:#fff}
  button.primary:hover{background:var(--accent2)}
  button.ghost{background:transparent;border:1px solid var(--line)}
  button.danger{background:transparent;color:var(--danger);border:1px solid #4a2a2e}
  button.danger:hover{background:#2a1a1d}
  button:disabled{opacity:.4;cursor:not-allowed}
  input,textarea,select{font:inherit;width:100%;background:var(--bg);color:var(--txt);
        border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none}
  input:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:90px;line-height:1.55}

  header{display:flex;align-items:center;gap:12px;padding:12px 18px;
         background:var(--panel);border-bottom:1px solid var(--line);height:60px}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  header .spacer{flex:1}
  .badge{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--panel2);color:var(--dim)}
  .badge.on{background:rgba(62,207,142,.14);color:var(--ok)}
  .badge.dirty{background:rgba(245,165,36,.14);color:var(--warn)}

  main{display:grid;grid-template-columns:190px 340px 1fr;height:calc(100% - 60px)}
  @media(max-width:1100px){main{grid-template-columns:160px 300px 1fr}}

  nav{background:var(--panel);border-right:1px solid var(--line);padding:10px 8px;overflow-y:auto}
  nav .tab{display:flex;justify-content:space-between;align-items:center;gap:6px;
           padding:9px 11px;border-radius:8px;cursor:pointer;color:var(--dim);font-size:13px}
  nav .tab:hover{background:var(--panel2);color:var(--txt)}
  nav .tab.active{background:var(--accent);color:#fff}
  nav .tab .n{font-size:11px;opacity:.75}
  nav .grp{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:#5f5f68;
           padding:14px 11px 6px}

  .listPane{background:var(--panel);border-right:1px solid var(--line);
            display:flex;flex-direction:column;overflow:hidden}
  .listHead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .listHead input{padding:7px 10px;font-size:13px}
  #list{flex:1;overflow-y:auto;padding:8px}
  .listFoot{padding:10px 14px;border-top:1px solid var(--line)}

  .item{display:flex;align-items:center;gap:10px;padding:9px;margin-bottom:6px;
        background:var(--panel2);border:1px solid transparent;border-radius:var(--radius);
        cursor:pointer;transition:border-color .12s,background .12s}
  .item:hover{border-color:#3a3a42}
  .item.sel{border-color:var(--accent);background:#25252c}
  .item.dragging{opacity:.35}
  .item.over{box-shadow:0 -2px 0 0 var(--accent)}
  .item .grip{color:#55555f;cursor:grab;font-size:15px;line-height:1;user-select:none;padding:0 2px}
  .item .grip:active{cursor:grabbing}
  .item img{width:42px;height:42px;object-fit:cover;border-radius:6px;background:#000;flex:none}
  .item .no-img{width:42px;height:42px;border-radius:6px;background:#0e0e10;flex:none;
                display:grid;place-items:center;color:#4a4a52;font-size:16px}
  .item .meta{flex:1;min-width:0}
  .item .t{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .s{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .editPane{overflow-y:auto;padding:22px 26px}
  .editPane .empty{color:var(--dim);text-align:center;margin-top:22vh;font-size:14px;line-height:1.8}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;
               color:var(--dim);margin-bottom:6px}
  .field .hint{font-size:11px;color:#5f5f68;margin-top:5px}
  .editHead{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .editHead h2{font-size:16px;margin:0;font-weight:600;flex:1}

  .drop{border:1.5px dashed var(--line);border-radius:var(--radius);padding:14px;
        display:flex;gap:14px;align-items:center;transition:.15s;background:var(--panel)}
  .drop.hot{border-color:var(--accent);background:rgba(108,99,255,.07)}
  .drop img{width:104px;height:70px;object-fit:cover;border-radius:7px;background:#000;flex:none}
  .drop .info{flex:1;min-width:0}
  .drop .path{font-size:11px;color:var(--dim);word-break:break-all;margin-bottom:6px}
  .drop .sz{font-size:11px}
  .sz .big{color:var(--warn)} .sz .good{color:var(--ok)}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
         background:var(--panel2);border:1px solid var(--line);padding:11px 20px;
         border-radius:24px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  .toast.err{border-color:#4a2a2e;color:#ff9ba0}

  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:50;
         align-items:center;justify-content:center;padding:30px}
  .sheet.open{display:flex}
  .sheet .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;
              width:min(1000px,100%);height:min(88vh,900px);display:flex;flex-direction:column;overflow:hidden}
  .sheet .boxHead{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
  .sheet .boxHead h3{margin:0;font-size:14px;flex:1;font-weight:600}
  .sheet iframe{flex:1;border:none;background:#fff;width:100%}
  .sheet pre{flex:1;overflow:auto;margin:0;padding:18px;font:12px/1.6 ui-monospace,Consolas,monospace;
             color:#c9d1d9;background:#0d0d0f;white-space:pre-wrap}
</style>
</head>
<body>

<header>
  <h1>Content Editor</h1>
  <span id="repoBadge" class="badge">not connected</span>
  <span id="dirtyBadge" class="badge dirty" hidden>unsaved</span>
  <div class="spacer"></div>
  <button id="connectBtn" class="ghost">Connect repo folder</button>
  <button id="previewBtn" class="ghost">Preview</button>
  <button id="diffBtn" class="ghost">Review changes</button>
  <button id="saveBtn" class="primary" disabled>Save</button>
</header>

<main>
  <nav id="tabs"></nav>

  <section class="listPane">
    <div class="listHead">
      <input id="filter" type="search" placeholder="Filter items...">
    </div>
    <div id="list"></div>
    <div class="listFoot"><button id="addBtn" class="ghost" style="width:100%">+ Add item</button></div>
  </section>

  <section class="editPane" id="editPane">
    <div class="empty">Pick a section on the left, then an item to edit.<br>Connect your repo folder to enable saving and image compression.</div>
  </section>
</main>

<div class="sheet" id="sheet">
  <div class="box">
    <div class="boxHead">
      <h3 id="sheetTitle">Preview</h3>
      <button id="sheetReload" class="ghost">Reload</button>
      <button id="sheetClose" class="ghost">Close</button>
    </div>
    <iframe id="sheetFrame" hidden></iframe>
    <pre id="sheetPre" hidden></pre>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="assets/js/editor.js"></script>
</body>
</html>
